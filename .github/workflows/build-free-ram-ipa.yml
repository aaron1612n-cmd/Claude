name: Build Free RAM Downloader IPA

on:
  push:
    paths:
      - "free-ram-downloader/**"
      - ".github/workflows/build-free-ram-ipa.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: free-ram-downloader
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project FreeRAMDownloader.xcodeproj \
            -scheme FreeRAMDownloader \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package .ipa
        run: |
          rm -rf Payload FreeRAMDownloader.ipa
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/FreeRAMDownloader.app Payload/
          zip -qry FreeRAMDownloader.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: FreeRAMDownloader-ipa
          path: free-ram-downloader/FreeRAMDownloader.ipa
