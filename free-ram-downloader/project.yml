name: FreeRAMDownloader
options:
  bundleIdPrefix: lol.fakeram
  deploymentTarget:
    iOS: "16.0"
targets:
  FreeRAMDownloader:
    type: application
    platform: iOS
    sources:
      - FreeRAMDownloader
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: lol.fakeram.FreeRAMDownloader
        MARKETING_VERSION: "9.9.9"
        CURRENT_PROJECT_VERSION: "999"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "FREE RAM!!!"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
