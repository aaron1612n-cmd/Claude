<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b1a17">
<title>camascii</title>
<meta name="description" content="Your camera, typeset live in ASCII.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%231b1a17'/%3E%3Ctext x='16' y='23' font-family='monospace' font-size='20' text-anchor='middle' fill='%23d2321e'%3E%40%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  /* Palette: darkroom paper + one safelight accent */
  :root {
    --paper: #ece6d8;
    --paper-2: #e2dac8;
    --ink: #1b1a17;
    --graphite: #6e6a60;
    --rule: #c9c0ab;
    --safelight: #d2321e;
    --mono: "DM Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    --serif: "Instrument Serif", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
    --gutter: 16px;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font: 13px/1.4 var(--mono);
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--safelight); outline-offset: 2px; }
  [hidden] { display: none !important; }

  /* ---------- layout: viewfinder left, ledger right ---------- */
  .app {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 300px;
    height: 100dvh;
    padding: max(var(--gutter), env(safe-area-inset-top)) max(var(--gutter), env(safe-area-inset-right)) max(var(--gutter), env(safe-area-inset-bottom)) max(var(--gutter), env(safe-area-inset-left));
    gap: var(--gutter);
  }

  .finder {
    position: relative;
    background: var(--ink);
    overflow: hidden;
    min-height: 0;
    touch-action: none;
  }
  .finder canvas#out { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .finder video { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }

  /* film-edge corner marks */
  .edge {
    position: absolute; z-index: 2;
    font-size: 10px; letter-spacing: .12em; text-transform: uppercase;
    pointer-events: none;
    background: var(--ink);
    color: #b8b09f;
    padding: 3px 6px 2px;
  }
  .edge.tl { top: 10px; left: 12px; }
  .edge.tr { top: 10px; right: 12px; }
  .edge.bl { bottom: 10px; left: 12px; }
  .edge.br { bottom: 10px; right: 12px; }
  .edge .rec { color: var(--safelight); }
  .edge.warn { background: var(--safelight); color: var(--paper); }
  .seg button:disabled { opacity: .45; cursor: default; }
  .seg #torch[aria-pressed="true"] { background: var(--safelight); border-color: var(--safelight); color: var(--paper); }
  .torch-m { display: none; }

  .gate {
    position: absolute; inset: 0; z-index: 3;
    display: grid; place-items: end start;
    padding: 44px 12px;
  }
  .gate > div { background: var(--ink); padding: 14px; max-width: 100%; }
  .gate button {
    background: var(--paper);
    color: var(--ink);
    border: 0;
    padding: 14px 20px 13px;
    font-size: 14px;
    letter-spacing: .04em;
    display: inline-flex; gap: 12px; align-items: center;
  }
  .gate button::before {
    content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--safelight);
  }
  .gate button:hover { background: #fff; }
  .gate p { margin: 10px 0 0; color: #a49d8e; font-size: 12px; max-width: 34ch; }

  /* developing sweep: the one motion moment */
  .sweep {
    position: absolute; left: 0; right: 0; top: 0; height: 100%;
    z-index: 2; pointer-events: none;
    transform: translateY(-100%);
  }
  .sweep::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 3px;
    background: var(--safelight);
  }
  .sweep.go { animation: develop 620ms cubic-bezier(.6,.05,.3,1) forwards; background: rgba(210,50,30,.18); }
  @keyframes develop {
    0% { transform: translateY(-100%); }
    100% { transform: translateY(0); opacity: 0; }
  }

  /* ---------- ledger (controls) ---------- */
  .ledger {
    display: flex; flex-direction: column;
    min-height: 0;
    border-top: 2px solid var(--ink);
  }
  .mast {
    display: flex; align-items: baseline; justify-content: space-between;
    padding: 8px 0 14px;
    border-bottom: 1px solid var(--rule);
  }
  .mast h1 {
    margin: 0;
    font: italic 400 46px/0.9 var(--serif);
    letter-spacing: -.01em;
  }
  .mast .no { font-size: 11px; color: var(--graphite); letter-spacing: .1em; }

  .rows { list-style: none; margin: 0; padding: 0; }
  .row {
    display: grid; grid-template-columns: 74px minmax(0, 1fr);
    align-items: center; gap: 10px;
    padding: 11px 0;
    border-bottom: 1px solid var(--rule);
  }
  .row > label, .row > .k {
    font-size: 10px; text-transform: uppercase; letter-spacing: .14em; color: var(--graphite);
  }
  .row kbd {
    font: inherit; font-size: 9px; color: var(--graphite);
    border: 1px solid var(--rule); padding: 0 4px; margin-left: 4px;
  }
  body.touch .row kbd, body.touch .keys { display: none; }

  .seg { display: flex; flex-wrap: wrap; gap: 4px; }
  .seg button {
    background: transparent; border: 1px solid var(--rule);
    padding: 5px 7px; font-size: 12px; white-space: pre;
    min-height: 30px;
  }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .seg button:hover:not([aria-pressed="true"]) { border-color: var(--ink); }

  input[type=range] {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 28px; background: transparent; margin: 0;
  }
  input[type=range]::-webkit-slider-runnable-track {
    height: 1px; background: var(--ink);
  }
  input[type=range]::-moz-range-track { height: 1px; background: var(--ink); }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 12px; height: 18px; margin-top: -9px;
    background: var(--paper); border: 1.5px solid var(--ink); border-radius: 0;
  }
  input[type=range]::-moz-range-thumb {
    width: 10px; height: 16px; background: var(--paper); border: 1.5px solid var(--ink); border-radius: 0;
  }
  .val { font-size: 11px; color: var(--graphite); min-width: 3ch; text-align: right; }
  .slide { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 8px; align-items: center; }

  .switches { display: flex; gap: 4px; flex-wrap: wrap; }

  /* contact sheet */
  .sheet {
    flex: 1; min-height: 0; overflow-y: auto;
    padding: 12px 0 0;
  }
  .sheet h2 {
    margin: 0 0 8px; font: 400 10px/1 var(--mono);
    text-transform: uppercase; letter-spacing: .14em; color: var(--graphite);
    display: flex; justify-content: space-between;
  }
  .frames {
    display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 6px;
  }
  .frames button {
    border: 0; padding: 0; background: var(--ink); position: relative;
    aspect-ratio: 4 / 3; overflow: hidden;
  }
  .frames img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .frames span {
    position: absolute; left: 3px; bottom: 2px; font-size: 9px; color: var(--safelight);
    letter-spacing: .06em;
  }
  .frames .new { animation: drop 380ms 520ms cubic-bezier(.2,.8,.2,1) backwards; }
  @keyframes drop { from { transform: translateY(-14px); opacity: 0; } }
  .empty { color: var(--graphite); font-size: 11px; margin: 0; }

  .shoot {
    margin-top: 12px;
    display: grid; grid-template-columns: 1fr auto; gap: 8px;
  }
  .btn-shutter {
    background: var(--safelight); color: var(--paper); border: 0;
    padding: 14px 16px; font-size: 14px; letter-spacing: .06em; text-align: left;
    display: flex; justify-content: space-between; align-items: center;
  }
  .btn-shutter:hover { background: #b9281a; }
  .btn-shutter:disabled { background: var(--rule); color: var(--graphite); cursor: default; }
  .btn-plain {
    background: transparent; border: 1px solid var(--ink); padding: 0 14px; font-size: 12px;
  }
  .btn-plain[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
  .keys { margin: 10px 0 0; font-size: 10px; color: var(--graphite); line-height: 1.7; }

  /* mobile bar (touch / narrow) */
  .bar { display: none; }

  /* ---------- viewer overlay ---------- */
  .viewer {
    position: fixed; inset: 0; z-index: 20;
    background: var(--ink);
    display: grid; grid-template-rows: minmax(0,1fr) auto;
    padding: max(var(--gutter), env(safe-area-inset-top)) var(--gutter) max(var(--gutter), env(safe-area-inset-bottom));
    gap: 12px;
  }
  .viewer img { max-width: 100%; max-height: 100%; margin: auto; display: block; object-fit: contain; min-height: 0; }
  .viewer .acts { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-start; max-width: 900px; width: 100%; margin: 0 auto; }
  .viewer .acts button {
    background: transparent; color: var(--paper); border: 1px solid #5a564d;
    padding: 10px 12px; font-size: 13px;
  }
  @media (max-width: 760px) {
    .viewer .acts { gap: 6px; }
    .viewer .acts .spacer { flex-basis: 100%; height: 0; }
  }
  .viewer .acts button.primary { background: var(--paper); color: var(--ink); border-color: var(--paper); }
  .viewer .acts .spacer { flex: 1; }
  .viewer .acts .note { color: #a49d8e; font-size: 11px; align-self: center; }

  /* ---------- narrow / touch layout ---------- */
  @media (max-width: 760px) {
    .app {
      grid-template-columns: 1fr;
      grid-template-rows: auto minmax(0,1fr) auto;
      padding: max(10px, env(safe-area-inset-top)) max(var(--gutter), env(safe-area-inset-right)) 0 max(var(--gutter), env(safe-area-inset-left));
      gap: 10px;
    }
    .ledger { display: contents; }
    .mast { order: -1; border: 0; padding: 0; grid-row: 1; border-top: 2px solid var(--ink); padding-top: 6px; }
    .mast h1 { font-size: 34px; }
    .mast { align-items: center; }
    .mast .no { margin-left: auto; margin-right: 12px; }
    .torch-m {
      display: grid; place-items: center; width: 44px; height: 44px; padding: 0;
      border: 1px solid var(--ink); background: transparent;
    }
    .torch-m[aria-pressed="true"] { background: var(--safelight); border-color: var(--safelight); color: var(--paper); }
    .torch-m:disabled { opacity: .35; }
    .finder { grid-row: 2; }
    .controls {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
      background: var(--paper);
      border-top: 2px solid var(--ink);
      padding: 6px var(--gutter) calc(96px + env(safe-area-inset-bottom));
      max-height: 70dvh; overflow-y: auto;
      transform: translateY(100%);
      transition: transform 260ms cubic-bezier(.2,.8,.2,1);
    }
    .controls.open { transform: translateY(0); }
    .sheet, .shoot, .keys { display: none; }
    .bar {
      grid-row: 3;
      display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
      padding: 10px 0 max(12px, env(safe-area-inset-bottom));
      position: relative; z-index: 11; background: var(--paper);
    }
    .bar .left { display: flex; gap: 8px; }
    .bar .right { display: flex; justify-content: flex-end; gap: 8px; }
    .bar .sq {
      width: 52px; height: 52px; border: 1px solid var(--ink); background: transparent;
      display: grid; place-items: center; padding: 0; position: relative; overflow: hidden;
    }
    .bar .sq[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
    .bar .sq img { width: 100%; height: 100%; object-fit: cover; }
    .bar .sq .count {
      position: absolute; right: 2px; bottom: 1px; font-size: 9px; color: var(--safelight);
    }
    .bar .shutter {
      width: 72px; height: 72px; border-radius: 50%;
      border: 2px solid var(--ink); background: var(--paper); padding: 5px;
    }
    .bar .shutter::before {
      content: ""; display: block; width: 100%; height: 100%; border-radius: 50%; background: var(--safelight);
    }
    .bar .shutter:active::before { background: #a42214; }
    .bar .shutter:disabled::before { background: var(--rule); }
    .gate { padding: 20px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .sweep.go, .frames .new { animation: none; }
    .controls { transition: none; }
  }
</style>
</head>
<body>
<div class="app">
  <main class="finder" id="finder" aria-label="ASCII viewfinder">
    <canvas id="out" role="img" aria-label="Live ASCII rendering of the camera"></canvas>
    <video id="cam" playsinline muted autoplay></video>
    <div class="edge tl" id="edgeTL">camascii</div>
    <div class="edge tr" id="edgeTR">— × —</div>
    <div class="edge bl" id="edgeBL"><span class="rec" id="rec">○</span> standby</div>
    <div class="edge br" id="edgeBR">00 fps</div>
    <div class="sweep" id="sweep"></div>
    <div class="gate" id="gate">
      <div>
        <button id="open" type="button">Open camera</button>
        <p id="gateMsg">Frames never leave your device.</p>
      </div>
    </div>
  </main>

  <aside class="ledger">
    <header class="mast">
      <h1>camascii</h1>
      <span class="no" id="frameNo">No. 000</span>
      <button class="torch-m" id="torchM" type="button" aria-label="Flashlight" aria-pressed="false" disabled>
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M11.5 1.5 4 11h5l-1 7.5L16 9h-5z"/></svg>
      </button>
    </header>

    <div class="controls" id="controls">
      <ul class="rows">
        <li class="row">
          <label for="grain">Grain<kbd>[ ]</kbd></label>
          <div class="slide"><input id="grain" type="range" min="40" max="240" step="2" value="120"><span class="val" id="grainVal">120</span></div>
        </li>
        <li class="row">
          <span class="k">Ramp<kbd>R</kbd></span>
          <div class="seg" id="ramps" role="group" aria-label="Character ramp"></div>
        </li>
        <li class="row">
          <span class="k">Ink<kbd>I</kbd></span>
          <div class="seg" id="inks" role="group" aria-label="Ink"></div>
        </li>
        <li class="row">
          <label for="contrast">Contrast</label>
          <div class="slide"><input id="contrast" type="range" min="0.5" max="2.5" step="0.05" value="1.2"><span class="val" id="contrastVal">1.2</span></div>
        </li>
        <li class="row">
          <label for="bright">Exposure</label>
          <div class="slide"><input id="bright" type="range" min="-0.5" max="0.5" step="0.02" value="0"><span class="val" id="brightVal">0</span></div>
        </li>
        <li class="row">
          <span class="k">Print</span>
          <div class="switches">
            <div class="seg"><button type="button" id="invert" aria-pressed="false">invert<kbd>V</kbd></button></div>
            <div class="seg"><button type="button" id="mirror" aria-pressed="true">mirror<kbd>M</kbd></button></div>
            <div class="seg"><button type="button" id="flip" hidden>flip lens</button></div>
            <div class="seg"><button type="button" id="torch" aria-pressed="false" disabled>flashlight<kbd>L</kbd></button></div>
          </div>
        </li>
      </ul>
    </div>

    <section class="sheet" aria-label="Contact sheet">
      <h2><span>Contact sheet</span><span id="sheetCount">0</span></h2>
      <p class="empty" id="empty">Nothing exposed yet.</p>
      <div class="frames" id="frames"></div>
    </section>

    <div class="shoot">
      <button class="btn-shutter" id="shutter" type="button" disabled><span>Expose</span><span>␣</span></button>
      <button class="btn-plain" id="freeze" type="button" aria-pressed="false">hold</button>
    </div>
    <p class="keys">space expose · F hold · wheel grain</p>

    <nav class="bar" aria-label="Camera controls">
      <div class="left">
        <button class="sq" id="tune" type="button" aria-pressed="false" aria-label="Settings">
          <svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 6h18M2 16h18"/><rect x="5" y="3.5" width="4" height="5" fill="var(--paper)"/><rect x="13" y="13.5" width="4" height="5" fill="var(--paper)"/></svg>
        </button>
        <button class="sq" id="rampCycle" type="button" aria-label="Next character ramp" style="font-size:16px">@#</button>
      </div>
      <button class="shutter" id="shutterM" type="button" aria-label="Expose" disabled></button>
      <div class="right">
        <button class="sq" id="flipM" type="button" aria-label="Switch camera" hidden>
          <svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 9a7 7 0 0 1 13-2M18 13a7 7 0 0 1-13 2"/><path d="M17 3v4h-4M5 19v-4h4"/></svg>
        </button>
        <button class="sq" id="lastShot" type="button" aria-label="Open contact sheet"><span class="count" id="countM"></span></button>
      </div>
    </nav>
  </aside>
</div>

<div class="viewer" id="viewer" hidden role="dialog" aria-modal="true" aria-label="Exposure">
  <img id="viewImg" alt="">
  <div class="acts">
    <button class="primary" id="savePng" type="button">Save PNG</button>
    <button id="copyTxt" type="button">Copy text</button>
    <button id="saveTxt" type="button">Save .txt</button>
    <button id="prevShot" type="button" aria-label="Previous exposure">←</button>
    <button id="nextShot" type="button" aria-label="Next exposure">→</button>
    <span class="note" id="viewNote"></span>
    <span class="spacer"></span>
    <button id="delShot" type="button">Discard</button>
    <button id="closeView" type="button">Close</button>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
